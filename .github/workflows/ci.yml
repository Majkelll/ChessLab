name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: [self-hosted, chesslab]

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: mise exec dotnet@10.0.400 -- dotnet restore ChessLab.slnx

      - name: Build
        run: mise exec dotnet@10.0.400 -- dotnet build ChessLab.slnx --no-restore -c Release

      # Unit tests only: the E2E suite (Playwright + a real browser) is currently
      # flaky/slow on this runner's headless environment and would make it an
      # unreliable merge gate. Revisit once that's sorted out.
      - name: Test
        run: mise exec dotnet@10.0.400 -- dotnet test tests/ChessLab.Core.Tests/ChessLab.Core.Tests.csproj --no-build -c Release
