name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: [self-hosted, chesslab]

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: mise exec dotnet@10.0.400 -- dotnet restore ChessLab.slnx

      - name: Build
        run: mise exec dotnet@10.0.400 -- dotnet build ChessLab.slnx --no-restore -c Release

      - name: Test
        run: mise exec dotnet@10.0.400 -- dotnet test ChessLab.slnx --no-build -c Release
