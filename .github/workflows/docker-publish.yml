name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: [self-hosted, chesslab]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore
        run: mise exec dotnet@10.0.400 -- dotnet restore ChessLab.slnx

      - name: Build
        run: mise exec dotnet@10.0.400 -- dotnet build ChessLab.slnx --no-restore -c Release

      - name: Test
        run: mise exec dotnet@10.0.400 -- dotnet test tests/ChessLab.Core.Tests/ChessLab.Core.Tests.csproj --no-build -c Release

      - name: Test the web host
        run: mise exec dotnet@10.0.400 -- dotnet test tests/ChessLab.Web.Tests/ChessLab.Web.Tests.csproj --no-build -c Release

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Compute build version
        id: version
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          provenance: false
          sbom: false

      - name: Deploy to Render
        run: >
          $HOME/.local/bin/render deploys create srv-d9unvhvavr4c73b264j0
          --image ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
          --wait --confirm
